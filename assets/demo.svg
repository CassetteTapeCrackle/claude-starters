<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320" role="img"
     aria-label="Terminal demo: /apply-starter rust --framework axum writes a CLAUDE.md and activates 14 agents, then git status --short shows nothing, because every file it wrote is git-ignored.">
  <title>claude-starters demo — apply a starter, leave zero repo footprint</title>
  <defs>
    <style>
      .win  { fill:#12161d; stroke:#2a3038; stroke-width:1 }
      .bar  { fill:#1a1f27 }
      .ttl  { fill:#6b7684; font:400 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
      .mono { font:400 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre }
      .ps1  { fill:#4F9A61 }
      .cmd  { fill:#e6edf3 }
      .out  { fill:#a9b4c0 }
      .num  { fill:#D97757 }
      .rem  { fill:#5a6472; font-style:italic }
      .cur  { fill:#D97757 }

      @keyframes t1  {0%,1.3%{width:0}   13.3%,92%{width:324px} 97%,100%{width:324px}}
      @keyframes c1  {0%,1.2%{opacity:0} 1.3%,13.3%{opacity:1}  13.4%,100%{opacity:0}}
      @keyframes x1  {0%,1.3%{x:42px}    13.3%,92%{x:366px}     97%,100%{x:366px}}
      @keyframes t2  {0%,19.3%{width:0}  27.7%,92%{width:225px} 97%,100%{width:225px}}
      @keyframes c2  {0%,19.2%{opacity:0}19.3%,27.7%{opacity:1} 27.8%,100%{opacity:0}}
      @keyframes x2  {0%,19.3%{x:42px}   27.7%,92%{x:267px}     97%,100%{x:267px}}
      @keyframes t3  {0%,33.3%{width:0}  39.3%,92%{width:162px} 97%,100%{width:162px}}
      @keyframes c3  {0%,33.2%{opacity:0}33.3%,39.3%{opacity:1} 39.4%,100%{opacity:0}}
      @keyframes x3  {0%,33.3%{x:42px}   39.3%,92%{x:204px}     97%,100%{x:204px}}

      @keyframes r1  {0%,1.2%{opacity:0}  1.3%,92%{opacity:1} 97%,100%{opacity:0}}
      @keyframes r2  {0%,15.3%{opacity:0}15.4%,92%{opacity:1} 97%,100%{opacity:0}}
      @keyframes r3  {0%,19.2%{opacity:0}19.3%,92%{opacity:1} 97%,100%{opacity:0}}
      @keyframes r4  {0%,29.3%{opacity:0}29.4%,92%{opacity:1} 97%,100%{opacity:0}}
      @keyframes r5  {0%,33.2%{opacity:0}33.3%,92%{opacity:1} 97%,100%{opacity:0}}
      @keyframes r6  {0%,42.0%{opacity:0}42.1%,92%{opacity:1} 97%,100%{opacity:0}}
      @keyframes r7  {0%,44.7%{opacity:0}44.8%,92%{opacity:1} 97%,100%{opacity:0}}
      @keyframes r8  {0%,48.0%{opacity:0}48.1%,92%{opacity:1} 97%,100%{opacity:0}}
      @keyframes blink {0%,49%{opacity:1} 50%,100%{opacity:0}}

      #clip1 rect { animation:t1 15s steps(36,end) infinite }
      #clip2 rect { animation:t2 15s steps(25,end) infinite }
      #clip3 rect { animation:t3 15s steps(18,end) infinite }
      .cur1 { animation:x1 15s steps(36,end) infinite, c1 15s linear infinite }
      .cur2 { animation:x2 15s steps(25,end) infinite, c2 15s linear infinite }
      .cur3 { animation:x3 15s steps(18,end) infinite, c3 15s linear infinite }
      .a1{animation:r1 15s linear infinite} .a2{animation:r2 15s linear infinite}
      .a3{animation:r3 15s linear infinite} .a4{animation:r4 15s linear infinite}
      .a5{animation:r5 15s linear infinite} .a6{animation:r6 15s linear infinite}
      .a7{animation:r7 15s linear infinite} .a8{animation:r8 15s linear infinite}
      .blinker{animation:blink 1.06s steps(1,end) infinite}
    </style>
    <clipPath id="clip1"><rect x="42" y="58" width="324" height="24"/></clipPath>
    <clipPath id="clip2"><rect x="42" y="120" width="225" height="24"/></clipPath>
    <clipPath id="clip3"><rect x="42" y="182" width="162" height="24"/></clipPath>
  </defs>

  <rect class="win" x="0.5" y="0.5" width="779" height="319" rx="12"/>
  <path class="bar" d="M0.5 12.5a12 12 0 0 1 12-12h755a12 12 0 0 1 12 12V36H0.5Z"/>
  <circle cx="24" cy="18" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="18" r="5.5" fill="#febc2e"/>
  <circle cx="64" cy="18" r="5.5" fill="#28c840"/>
  <text class="ttl" x="390" y="22" text-anchor="middle">~/my-rust-service</text>

  <g class="mono">
    <text class="ps1 a1" x="24" y="76">&#10095;</text>
    <g clip-path="url(#clip1)"><text class="cmd" x="42" y="76" textLength="324" lengthAdjust="spacing">/apply-starter rust --framework axum</text></g>
    <rect class="cur cur1" x="42" y="62" width="9" height="18" opacity="0"/>
    <text class="out a2" x="42" y="102">Applied rust starter (framework: axum) to .</text>

    <text class="ps1 a3" x="24" y="138">&#10095;</text>
    <g clip-path="url(#clip2)"><text class="cmd" x="42" y="138" textLength="225" lengthAdjust="spacing">ls .claude/agents | wc -l</text></g>
    <rect class="cur cur2" x="42" y="124" width="9" height="18" opacity="0"/>
    <text class="num a4" x="42" y="164">14</text>

    <text class="ps1 a5" x="24" y="200">&#10095;</text>
    <g clip-path="url(#clip3)"><text class="cmd" x="42" y="200" textLength="162" lengthAdjust="spacing">git status --short</text></g>
    <rect class="cur cur3" x="42" y="186" width="9" height="18" opacity="0"/>

    <text class="rem a6" x="42" y="228">nothing. CLAUDE.md + 14 agents are all git-ignored —</text>
    <text class="rem a7" x="42" y="252">your repo is byte-for-byte what it was before.</text>

    <text class="ps1 a8" x="24" y="288">&#10095;</text>
    <g class="a8"><rect class="cur blinker" x="42" y="274" width="9" height="18"/></g>
  </g>
</svg>
