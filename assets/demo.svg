<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" role="img"
     aria-label="Terminal demo. Running /apply-starter rust --framework axum prints 'Applied rust starter (framework: axum) to .' It writes a CLAUDE.md with the framework pinned to axum, activates 14 stack-specific agents out of a 76-agent library, and arms the clean-code-rust depth skill which stays idle until you touch Rust code. Running git status --short then prints nothing, because the starter adds zero files to your repo.">
  <title>claude-starters — one command per stack, zero repo footprint</title>
  <defs>
    <style>
      .win  { fill:#12161d; stroke:#2a3038; stroke-width:1 }
      .bar  { fill:#1a1f27 }
      .ttl  { fill:#6b7684; font:400 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
      .mono { font:400 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre }
      .ann  { font:400 13.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
      .ps1  { fill:#4F9A61 }
      .cmd  { fill:#e6edf3 }
      .out  { fill:#a9b4c0 }
      .key  { fill:#D97757 }
      .des  { fill:#7d8794 }
      .rule { fill:#D97757; opacity:.35 }
      .cur  { fill:#D97757 }

      @keyframes t1 {0%,1.7%{width:0}   11.7%,92%{width:324px} 97%,100%{width:324px}}
      @keyframes x1 {0%,1.7%{x:42px}    11.7%,92%{x:366px}     97%,100%{x:366px}}
      @keyframes c1 {0%,1.6%{opacity:0} 1.7%,11.7%{opacity:1}  11.8%,100%{opacity:0}}
      @keyframes t2 {0%,25.6%{width:0}  30.6%,92%{width:162px} 97%,100%{width:162px}}
      @keyframes x2 {0%,25.6%{x:42px}   30.6%,92%{x:204px}     97%,100%{x:204px}}
      @keyframes c2 {0%,25.5%{opacity:0}25.6%,30.6%{opacity:1} 30.7%,100%{opacity:0}}

      @keyframes r1{0%,1.6%{opacity:0} 1.7%,92%{opacity:1} 97%,100%{opacity:0}}
      @keyframes r2{0%,13.2%{opacity:0}13.3%,92%{opacity:1}97%,100%{opacity:0}}
      @keyframes r3{0%,16.0%{opacity:0}16.1%,92%{opacity:1}97%,100%{opacity:0}}
      @keyframes r4{0%,18.2%{opacity:0}18.3%,92%{opacity:1}97%,100%{opacity:0}}
      @keyframes r5{0%,20.5%{opacity:0}20.6%,92%{opacity:1}97%,100%{opacity:0}}
      @keyframes r6{0%,25.5%{opacity:0}25.6%,92%{opacity:1}97%,100%{opacity:0}}
      @keyframes r7{0%,33.2%{opacity:0}33.3%,92%{opacity:1}97%,100%{opacity:0}}
      @keyframes r8{0%,35.5%{opacity:0}35.6%,92%{opacity:1}97%,100%{opacity:0}}
      @keyframes r9{0%,38.8%{opacity:0}38.9%,92%{opacity:1}97%,100%{opacity:0}}
      @keyframes blink{0%,49%{opacity:1} 50%,100%{opacity:0}}

      #clip1 rect{animation:t1 18s steps(36,end) infinite}
      #clip2 rect{animation:t2 18s steps(18,end) infinite}
      .cur1{animation:x1 18s steps(36,end) infinite, c1 18s linear infinite}
      .cur2{animation:x2 18s steps(18,end) infinite, c2 18s linear infinite}
      .a1{animation:r1 18s linear infinite} .a2{animation:r2 18s linear infinite}
      .a3{animation:r3 18s linear infinite} .a4{animation:r4 18s linear infinite}
      .a5{animation:r5 18s linear infinite} .a6{animation:r6 18s linear infinite}
      .a7{animation:r7 18s linear infinite} .a8{animation:r8 18s linear infinite}
      .a9{animation:r9 18s linear infinite} .blinker{animation:blink 1.06s steps(1,end) infinite}
    </style>
    <clipPath id="clip1"><rect x="42" y="58" width="324" height="24"/></clipPath>
    <clipPath id="clip2"><rect x="42" y="236" width="162" height="24"/></clipPath>
  </defs>

  <rect class="win" x="0.5" y="0.5" width="899" height="371" rx="12"/>
  <path class="bar" d="M0.5 12.5a12 12 0 0 1 12-12h875a12 12 0 0 1 12 12V36H0.5Z"/>
  <circle cx="24" cy="18" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="18" r="5.5" fill="#febc2e"/>
  <circle cx="64" cy="18" r="5.5" fill="#28c840"/>
  <text class="ttl" x="450" y="22" text-anchor="middle">~/my-rust-service</text>

  <g class="mono">
    <text class="ps1 a1" x="24" y="76">&#10095;</text>
    <g clip-path="url(#clip1)"><text class="cmd" x="42" y="76" textLength="324" lengthAdjust="spacing">/apply-starter rust --framework axum</text></g>
    <rect class="cur cur1" x="42" y="62" width="9" height="18" opacity="0"/>
    <text class="out a2" x="42" y="102">Applied rust starter (framework: axum) to .</text>
  </g>

  <rect class="rule a3" x="44" y="118" width="3" height="86" rx="1.5"/>
  <g class="ann">
    <text class="key a3" x="64" y="136">CLAUDE.md</text>
    <text class="des a3" x="210" y="136">tailored to rust &#8212; framework pinned to axum</text>
    <text class="key a4" x="64" y="164">.claude/agents/</text>
    <text class="des a4" x="210" y="164">14 rust experts on call, not all 76</text>
    <text class="key a5" x="64" y="192">clean-code-rust</text>
    <text class="des a5" x="210" y="192">lean &#8212; stays idle until you touch .rs</text>
  </g>

  <g class="mono">
    <text class="ps1 a6" x="24" y="254">&#10095;</text>
    <g clip-path="url(#clip2)"><text class="cmd" x="42" y="254" textLength="162" lengthAdjust="spacing">git status --short</text></g>
    <rect class="cur cur2" x="42" y="240" width="9" height="18" opacity="0"/>
  </g>

  <rect class="rule a7" x="44" y="272" width="3" height="30" rx="1.5"/>
  <g class="ann">
    <text class="des a7" x="64" y="290">no output &#8212; the starter added <tspan class="key">zero files</tspan> to your repo.</text>
  </g>

  <g class="mono">
    <text class="ps1 a9" x="24" y="330">&#10095;</text>
    <g class="a9"><rect class="cur blinker" x="42" y="316" width="9" height="18"/></g>
  </g>
</svg>
